[package]
name = "jasp"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Native Raspberry Pi frontend for jastreamer with optional moOde support"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
alsa = "0.10"
